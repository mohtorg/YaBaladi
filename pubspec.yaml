name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase
  firebase_core: 3.6.0
  cloud_firestore: 5.4.4
  firebase_auth: 5.3.1

  # Storage
  shared_preferences: ^2.3.0

  # UI
  cupertino_icons: 1.0.8
  go_router: ^18.0.2
  provider: ^6.1.5+1
  firebase_messaging: ^15.1.3

  # Utilities
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

  # === Fonts ===
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

  # === Assets ===
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D6EFD"
  adaptive_icon_foreground: "assets/icon/app_icon.png"