name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_sign_in: 6.3.0

  # Storage
  shared_preferences: ^2.3.0

  # UI & Navigation
  cupertino_icons: 1.0.8
  go_router: ^14.8.1
  provider: ^6.1.5+1

  # Network
  http: ^1.2.0

  # Location
  geolocator: ^13.0.0

  # External Links
  url_launcher: ^6.3.0

  # File Import
  csv: ^6.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # تم إزالة build_runner لتجنب تعارضات FlutterLab

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf