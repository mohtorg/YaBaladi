name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── Firebase ───
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1          # ⚠️ لا ترقّ لـ 7.x مع firebase_auth 5.x
  firebase_messaging: ^15.1.3

  # ─── Storage ───
  shared_preferences: ^2.3.0

  # ─── UI ───
  cupertino_icons: 1.0.8
  go_router: ^14.0.0              # ⚠️ v14: pushReplacement → void (0 type params)
  provider: ^6.1.5+1

  # ─── HTTP client (Nominatim + BigDataCloud) ───
  http: ^1.2.0

  # ─── Force fresh download — pinned exact versions ───
  file: 7.0.1
  fixnum: 1.1.1

  # ─── Maps (OpenStreetMap) ───
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ─── Geospatial (Wave 6 — Scalability) ───
  # ✅ لحساب Geohash وتجهيز النظام لآلاف الأماكن
  geohash_plus: ^1.1.1

  # ─── Location (GPS) — Wave 5.5b ───
  # geolocator 13.x: federated plugin — يشمل geolocator_web تلقائيًا
  # لكن نضيفه صراحةً لضمان العمل على FlutLab (Web preview)
  geolocator: ^13.0.0
  geolocator_web: ^4.0.0

  # ─── External Links (Google Maps Navigation) ───
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

  # === Assets ===
  assets:
    - assets/icon/app_icon.png
    - fonts/

  # === Fonts ===
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0D6EFD"
  adaptive_icon_foreground: "assets/icon/app_icon.png"