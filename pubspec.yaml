name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.8.0 <4.0.0'
  # مطلوب بواسطة google_sign_in 6.3.0 وباقي حزم Firebase 3.x/v5.x
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # intl: مطلوبة لملفات الترجمة المولّدة (gen-l10n) — الإصدار يحدده
  # flutter_localizations ولا يُثبَّت يدوياً (any = استخدم المثبّت من SDK)
  intl: any

  # ═══ Firebase (3.6.0 ecosystem — لا ترفع منفرداً) ═══
  # جميع حزم Firebase v3.x/v5.x مترابطة — ترقية أي واحدة تتطلب ترقية الكل
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  # google_sign_in 6.3.0: لا ترفع لـ 7.x حتى ترقية firebase_auth لـ 7.x
  google_sign_in: 6.3.0

  # ═══ Storage ═══
  shared_preferences: ^2.3.0

  # ═══ UI & Navigation ═══
  cupertino_icons: 1.0.8
  go_router: ^14.8.1   # آخر إصدار 14.x — bug fixes بدون migration
  provider: ^6.1.5+1

  # ═══ Network ═══
  http: ^1.2.0

  # ═══ Location (federated plugin — لا يحتاج geolocator_web) ═══
  geolocator: ^13.0.0

  # ═══ External Links ═══
  url_launcher: ^6.3.0

  # ═══ File Import ═══
  csv: ^6.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf