name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: 6.3.0
  firebase_messaging: ^15.1.3

  shared_preferences: ^2.3.0

  cupertino_icons: 1.0.8
  go_router: ^14.0.0
  provider: ^6.1.5+1

  http: ^1.2.0

  file: 7.0.1
  fixnum: 1.1.1

  geolocator: ^13.0.0
  geolocator_web: ^4.0.0

  url_launcher: ^6.3.1

  csv: ^6.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf
