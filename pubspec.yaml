name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_app_check: ^0.3.1+4
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  google_sign_in: ^6.3.0

  # Storage & Media
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.2

  # Network & Location
  http: ^1.2.0
  geolocator: ^13.0.0
  device_info_plus: ^10.1.2

  # Geospatial
  geobase: ^1.4.0
  geo_fence_utils: ^2.1.0
  geoflutterfire_plus: ^0.0.19

  # Files & Excel
  url_launcher: ^6.3.0
  csv: ^6.0.0
  file_picker: ^8.0.0
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  file_saver: ^0.2.14

  # Settings & Cache
  app_settings: ^5.1.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/app_icon.png
    - assets/data/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf