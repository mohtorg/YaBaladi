name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # ✅ الحل النهائي: ترك flutter_localizations يختار الإصدار المتوافق تلقائياً
  intl: any

  # Firebase Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  # ✅ تم حذف google_sign_in لأننا نستخدم signInWithProvider المدمج في Firebase

  # Storage & Media
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  
  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.5+1

  # Network & Location
  http: ^1.2.0
  geolocator: ^13.0.0

  # Geospatial & Distance (Wave 17+)
  # geobase: لحساب الـ Bounding Box من ملفات GeoJSON (مكتبة نقية تعمل بدون إنترنت)
  # geo_fence_utils: للتحقق الدقيق (Point-in-Polygon) إذا توفرت حدود الأحياء
  # geoflutterfire_plus: للبحث الجغرافي السريع (Geohash) في Firestore للعثور على الأقرب
  geobase: ^1.4.0
  geo_fence_utils: ^2.1.0
  geoflutterfire_plus: ^0.0.19

  # External Links & Files
  url_launcher: ^6.3.0
  csv: ^6.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true # يتطلب وجود ملف l10n.yaml

  assets:
    - assets/icon/app_icon.png
    # Wave 18: ملف GeoJSON الذي يحتوي 80+ منطقة سكنية في بورسعيد
    - assets/data/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf