name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase
  firebase_core: 3.6.0
  cloud_firestore: 5.4.4
  firebase_auth: 5.3.1
  google_sign_in: ^6.2.1
  # Storage
  shared_preferences: ^2.3.0

  # UI
  cupertino_icons: 1.0.8
  go_router: ^18.0.2
  provider: ^6.1.5+1
  firebase_messaging: ^15.1.3

  # Utilities
  url_launcher: ^6.3.0

  # Maps (OpenStreetMap — free, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location (GPS + Governorate detection)
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

  # === Assets ===
  assets:
    - assets/icon/app_icon.png
    - fonts/

  # === Fonts ===
  # نستخدم Cairo Variable Font — ملف واحد يحتوي على كل الأوزان.
  # (Flutter 3.x يدعم Variable Fonts تلقائيًا)
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D6EFD"
  adaptive_icon_foreground: "assets/icon/app_icon.png"