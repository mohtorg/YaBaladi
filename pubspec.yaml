name: yabaladi_rebuild
description: "Ya Baladi - Local Discovery Platform for Port Said, Egypt"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # [v1.5.2] إزالة intl: any — يُسحَب تلقائياً من flutter_localizations
  # (any يسبب version solving conflict)

  # Firebase — [v1.5.2] ^ للسماح بتحديثات patch المتوافقة
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  # Storage
  shared_preferences: ^2.3.0

  # UI
  cupertino_icons: 1.0.8
  go_router: ^14.0.0
  provider: ^6.1.5+1
  firebase_messaging: ^15.1.3



  # HTTP client لـ Nominatim
  http: ^1.2.0

  # Force fresh download — pinned exact versions
  file: 7.0.1
  fixnum: 1.1.1

  # Maps (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location (GPS)
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  # build_runner معطَّل — غير مستخدم

flutter:
  uses-material-design: true
  generate: true

  # === Assets ===
  assets:
    - assets/icon/app_icon.png
    - fonts/

  # === Fonts ===
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0D6EFD"
  adaptive_icon_foreground: "assets/icon/app_icon.png"