analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/l10n/app_localizations*.dart
    - _archive/**

  errors:
    invalid_annotation_target: ignore
    # [v2 — 2026-10-23] كانتا في وضع ignore فتُخفيان أخطاء حقيقية
    # (استيرادات غير مستخدمة / استخدام context بعد await دون mounted).
    # أُعيدتا كتحذيرات مرئية؛ للعودة للسلوك السابق ضع ignore.
    unused_import: warning
    unused_local_variable: warning
    use_build_context_synchronously: warning

linter:
  # ملاحظة: صيغة rules هنا قائمة أسماء فقط. القواعد غير المدرجة تبقى معطّلة
  # (كانت الأسطر `rule: false` السابقة صيغة غير صالحة داخل قائمة).
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_empty_else
    - avoid_print
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes